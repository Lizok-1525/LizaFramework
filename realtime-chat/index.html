<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Chat Firebase</title>

    <!-- Estilos para el cuerpo y la lista de mensajes -->
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: auto;
        }

        #messages {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 5px;
        }
    </style>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="bg-body-secondary">
    <div class="container m-3">
        <h2>Chat en tiempo real</h2>

        <!-- Lista donde se mostrarán los mensajes -->
        <ul id="messages" class="list-group"></ul>

        <!-- Campo para el nombre y mensaje -->
        <div class="input-group mb-3">
            <input id="name" placeholder="Tu nombre" class="form-control" />
            <textarea id="message" placeholder="Escribe un mensaje..." class="form-control w-50" rows="4"></textarea>
            <button onclick="sendMessage()" class="btn btn-outline-secondary">Enviar</button>
        </div>
    </div>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // Configuración del proyecto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCis0PJOi20N8YcN87qY5KRUyWyFLjE9M4",
            authDomain: "mi-pagina-web-46841.firebaseapp.com",
            databaseURL: "https://mi-pagina-web-46841-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mi-pagina-web-46841",
            storageBucket: "mi-pagina-web-46841.firebasestorage.app",
            messagingSenderId: "671932914524",
            appId: "1:671932914524:web:d482e9700874d08ec2bf99",
            measurementId: "G-LZ3Y55P7QD"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Referencia a la colección "messages" en Firebase
        const messagesRef = db.ref("messages");

        // Función para enviar un mensaje
        function sendMessage() {
            const name = document.getElementById('name').value || "Anónimo";
            const message = document.getElementById('message').value;

            // Solo enviar si el mensaje no está vacío
            if (message.trim() !== "") {
                messagesRef.push({ name, text: message }); // Guardar en Firebase
                document.getElementById('message').value = ""; // Limpiar el campo
            }
        }

        // Mostrar los últimos 50 mensajes en tiempo real
        messagesRef.limitToLast(50).on('child_added', (snapshot) => {
            const msg = snapshot.val();

            // Crear y mostrar un nuevo elemento de lista con el mensaje
            const li = document.createElement('li');
            li.classList.add('list-group-item');
            li.innerHTML = `<strong>${msg.name}:</strong><pre style="margin:0;">${msg.text}</pre>`;
            document.getElementById('messages').appendChild(li);
        });

        // Enviar mensaje al presionar Enter en el textarea
        $('#message').keypress(function (event) {
            if (event.which === 13) { // Código 13 = tecla Enter
                event.preventDefault(); // Prevenir salto de línea o envío por defecto
                sendMessage(); // Llamar a la función de envío
            }
        });
    </script>
</body>

</html>
